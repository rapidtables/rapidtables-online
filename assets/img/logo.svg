  <text x="68" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="900" fill="currentColor" letter-spacing="-0.5">RapidTables<tspan fill="#2563EB">.online</tspan></text>
